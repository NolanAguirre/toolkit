<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account</title>
  <link rel="stylesheet" href="/auth/auth.css">
  <script src="/auth/auth.js" defer></script>
</head>
<body>
  <main>
    <h1>Create an account</h1>
    <p>Sign up with your email and a password.</p>
    <noscript><p>JavaScript is required to create an account.</p></noscript>
    <form data-mode="signup" action="/auth/register" method="post">
      <fieldset disabled>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint" required>
        <p id="password-hint" class="hint">Use at least 8 characters, up to 72 bytes. Some characters use more than one byte.</p>
        <label class="toggle"><input id="show-password" type="checkbox"> Show password</label>
        <button type="submit">Create account</button>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
    <p>Already have an account? <a data-auth-link href="/auth/signin">Sign in</a></p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
