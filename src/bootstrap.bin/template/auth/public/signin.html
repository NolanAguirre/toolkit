<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="/auth/auth.css">
  <script src="/auth/auth.js" defer></script>
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <p>Welcome back. Enter your email and password.</p>
    <noscript><p>JavaScript is required to sign in.</p></noscript>
    <form data-mode="signin" action="/auth/login" method="post">
      <fieldset disabled>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <label class="toggle"><input id="show-password" type="checkbox"> Show password</label>
        <button type="submit">Sign in</button>
      </fieldset>
    </form>
    <p id="status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></p>
    <p>Need an account? <a data-auth-link href="/auth/signup">Create an account</a></p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
