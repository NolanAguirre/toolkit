# Auth routes. Protect another location by adding:
#     access_by_lua_block { require("session").require_session() }
# Its upstream then receives the signed-in user's id as X-User-Id.

location = /auth/register {
    proxy_pass http://127.0.0.1:__PORT__;
}

location = /_auth/login {
    internal;
    proxy_pass http://127.0.0.1:__PORT__/auth/login;
}

location = /auth/login {
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    content_by_lua_block {
        local cjson = require "cjson.safe"
        local session = require "session"
        if ngx.req.get_method() ~= "POST" then
            return ngx.exit(ngx.HTTP_NOT_ALLOWED)
        end
        ngx.req.read_body()
        local res = ngx.location.capture("/_auth/login", {
            method = ngx.HTTP_POST,
            body = ngx.req.get_body_data() or "",
        })
        ngx.header.content_type = "application/json"
        if res.status ~= ngx.HTTP_OK then
            ngx.status = res.status
            ngx.print(res.body)
            return ngx.exit(res.status)
        end
        local user = cjson.decode(res.body)
        if not user or not user.id then
            ngx.status = ngx.HTTP_BAD_GATEWAY
            ngx.say(cjson.encode({ error = "invalid auth service response" }))
            return ngx.exit(ngx.status)
        end
        local ok, err = session.login(user)
        if not ok then
            ngx.log(ngx.ERR, "session save failed: ", err)
            ngx.status = ngx.HTTP_INTERNAL_SERVER_ERROR
            ngx.say(cjson.encode({ error = "could not start session" }))
            return ngx.exit(ngx.status)
        end
        ngx.say(cjson.encode({ id = user.id, email = user.email }))
    }
}

location = /auth/logout {
    content_by_lua_block {
        require("session").logout()
        ngx.header.content_type = "application/json"
        ngx.say('{"ok":true}')
    }
}

location = /auth/session {
    content_by_lua_block {
        local cjson = require "cjson.safe"
        local user = require("session").current()
        ngx.header.content_type = "application/json"
        if not user then
            ngx.status = ngx.HTTP_UNAUTHORIZED
            ngx.say(cjson.encode({ error = "unauthorized" }))
            return ngx.exit(ngx.status)
        end
        ngx.say(cjson.encode({ id = user.id, email = user.email }))
    }
}
