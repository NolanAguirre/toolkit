pid .runtime/nginx.pid;
error_log stderr notice;
env SESSION_SECRET;
events { worker_connections 1024; }
http {
    access_log .runtime/access.log;
    client_body_temp_path .runtime/body;
    proxy_temp_path .runtime/proxy;
    fastcgi_temp_path .runtime/fastcgi;
    uwsgi_temp_path .runtime/uwsgi;
    scgi_temp_path .runtime/scgi;
    lua_package_path "${prefix}lua/?.lua;;";
    init_by_lua_block {
        require("session").init({ host = "__MEMCACHED_HOST__", port = __MEMCACHED_PORT__ })
    }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen __HOST__:__PORT__;
        server_name _;
        # require_session() fills this; an empty value drops any client-sent X-User-Id.
        set $auth_user_id '';
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-User-Id $auth_user_id;
        # Location blocks for application UIs and APIs belong in routes/*.conf.
        include ../routes/*.conf;
        location / { return 404; }
    }
}
