<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your local toolkit workspace and registered repositories." />
    <title>Toolkit · Dashboard</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('toolkit-dashboard-theme')
          const dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.dataset.theme = 'dark'
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
