# Keep these upstream ports in sync with the applications' env-dir configuration.
location = / {
    return 302 /dashboard/;
}

location /api {
    proxy_pass http://127.0.0.1:6700;
    # The API allows toolkit commands up to 120 seconds.
    proxy_read_timeout 130s;
}

location /dashboard/harness-api {
    proxy_pass http://127.0.0.1:6000/api;
    client_max_body_size 4m;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
}

location /dashboard/ {
    proxy_pass http://127.0.0.1:6701;
    proxy_buffering off;
}
